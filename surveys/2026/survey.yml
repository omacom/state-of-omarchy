            label: Foot (default)
          - id: ghostty
            label: Ghostty
          - id: kitty
            label: Kitty
          - id: alacritty
            label: Alacritty
          - id: wezterm
            label: WezTerm
          - id: other
            label: Other
        allowOther: true

      - id: editor
        type: multiple
        prompt: Editors you actually use on Omarchy?
        options:
          - id: neovim
            label: Neovim
          - id: vscode
            label: VS Code
          - id: zed
            label: Zed
          - id: cursor
            label: Cursor
          - id: helix
            label: Helix
          - id: emacs
            label: Emacs
          - id: other
            label: Other
        allowOther: true

      - id: oma_apps
