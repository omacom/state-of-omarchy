            label: Claude Code
          - id: codex
            label: Codex
          - id: opencode
            label: OpenCode
          - id: gemini
            label: Gemini
          - id: grok
            label: Grok
          - id: copilot
            label: Copilot
          - id: crush
            label: Crush
          - id: pi
            label: Pi / Oh My Pi
          - id: none
            label: None

      - id: agent_cadence
        type: single
        prompt: How often do you launch the agent?
        options:
          - id: daily
            label: Daily
          - id: weekly
            label: Weekly
          - id: rare
            label: Rarely
          - id: never
            label: Never

      - id: crash_diag
        type: single
        prompt: Agent crash / core-dump diagnosis?
        options:
          - id: used_good
            label: Used it, it helped
          - id: used_meh
            label: Used it, meh
          - id: aware
            label: Know about it, haven't used it
          - id: unaware
            label: Didn't know that existed

      - id: uses_local_models
        type: single
        prompt: Do you use local models?
        options:
          - id: yes
            label: Yes
          - id: no
            label: No

      - id: local_llm
        type: multiple
        prompt: Local model stack, if any?
        showIf:
          questionId: uses_local_models
          op: eq
          values: [yes]
        options:
          - id: ollama
            label: Ollama
          - id: llama_cpp
            label: llama.cpp
          - id: vllm
            label: vLLM
          - id: mlx
            label: MLX
          - id: other
            label: Other
        allowOther: true

      - id: ai_share
        type: single
        prompt: Roughly how much of your coding on Omarchy is agent-assisted?
        options:
          - id: p0
            label: 0%
          - id: p20
            label: 1–20%
          - id: p40
            label: 21–40%
          - id: p60
            label: 41–60%
          - id: p80
            label: 61–80%
          - id: p100
            label: 81–100%

  - id: ops
    title: Updates & trust
    description: Channels, breakage, snapshots, security.
    questions:
      - id: update_cadence
        type: single
        prompt: How often do you update Omarchy?
        options:
          - id: prompted
            label: When Omarchy prompts
          - id: weekly
            label: Weekly on purpose
          - id: monthly
            label: Monthly or slower
          - id: never
            label: I don't update

      - id: breakage
        type: single
        prompt: Worst breakage in the last 6 months?
        options:
          - id: none
            label: None worth mentioning
          - id: minor
            label: Minor, fixed in minutes
          - id: day
            label: Lost a working session / half a day
          - id: reinstall
            label: Reinstall or snapshot rollback

      - id: snapshots
        type: single
        prompt: Do you use snapshots?
        options:
          - id: regular
            label: I use them regularly
          - id: once
            label: Used once, saved me
          - id: unused
            label: Aware, unused
          - id: unaware
            label: Didn't know

      - id: package_managers
        type: multiple
        prompt: Which package manager do you use?
        options:
          - id: pacman
            label: Pacman
          - id: aur
            label: AUR / yay
          - id: flatpak
            label: Flatpak
          - id: homebrew
            label: Homebrew
          - id: snap
            label: Snap
          - id: other
            label: Other
        allowOther: true

      - id: security
        type: single
        prompt: How do you feel about Omarchy's security posture?
        options:
          - id: comfortable
            label: Comfortable
          - id: cautious
            label: Fine, but I'm careful
          - id: concerned
            label: Concerned
          - id: dealbreaker
            label: Dealbreaker

  - id: gaming
    title: Gaming
    description: Steam, Proton, and game streaming.
    questions:
      - id: games_on_omarchy
        type: single
        required: true
        prompt: Do you game on Omarchy?
        options:
          - id: steam
            label: Yes — Steam / Proton
          - id: streaming
            label: Yes — streaming from another PC (Moonlight)
          - id: battlenet
            label: Yes — Battle.net
          - id: no
            label: No

      - id: gaming_satisfaction
        type: scale
        prompt: How's the gaming experience?
        showIf:
          questionId: games_on_omarchy
          op: includesAny
          values: [steam, streaming, battlenet]
        min: 1
        max: 5
        labels:
          1: Rough
          5: Better than I expected

  - id: opinions
    title: Opinions
    description: The editorial page.
    questions:
      - id: recommend
        type: nps
        prompt: How likely are you to recommend Omarchy to a friend who already uses a computer for work?
        min: 0
        max: 10

      - id: opinionated
        type: single
        prompt: The opinionated defaults are…
        options:
          - id: the_point
            label: The whole point
          - id: mostly
            label: Mostly good
          - id: too_much
            label: Too much DHH-in-my-OS
          - id: fight
            label: I spend time undoing them

      - id: biggest_wins
        type: multiple
        prompt: In your opinion, what are the biggest selling points of Omarchy?
        limit: 3
        options:
          - id: install
            label: Install / first hour
          - id: theme
            label: Theming that actually stays in sync
          - id: tiling
            label: Hyprland tiling, ready to go
          - id: shell
            label: Quattro shell / one-process desktop
          - id: ai
            label: Agent integration
          - id: plugins
            label: Plugins
          - id: hardware
            label: Hardware support (Macs, Framework, …)
          - id: docs
            label: Docs / manual
          - id: community
            label: Community
          - id: rolling
            label: Rolling updates
          - id: other
            label: Other
        allowOther: true

      - id: biggest_pains
        type: multiple
        prompt: In your opinion, what are the biggest pain points with Omarchy?
        limit: 3
        options:
          - id: breakage
            label: Updates / breakage
          - id: security
            label: Security / unsandboxed plugins
          - id: nvidia
            label: NVIDIA compatibility
          - id: apple
            label: Apple Silicon gaps
          - id: tiling
            label: Learning the tiling system (Hyprland)
          - id: missing_app
            label: A missing app I need
          - id: docs
            label: Docs
          - id: stability
            label: Stability
          - id: defaults
            label: Opinionated defaults I have to undo
          - id: hardware
            label: Hardware support gaps
          - id: other
            label: Other
        allowOther: true

      - id: omakub
        type: single
        prompt: Have you used Omakub (the Ubuntu sibling)?
        options:
          - id: both
            label: I use both
          - id: used
            label: Used it, then moved to Omarchy
          - id: aware
            label: Know it, don't use it
          - id: unaware
            label: First I'm hearing of it

      - id: year_from_now
        type: single
        prompt: A year from now you expect to…
        options:
          - id: daily
            label: Still daily-drive Omarchy
          - id: side
            label: Keep it on a side machine
          - id: leave
            label: Be back on something else
          - id: unsure
            label: Too soon to say

      - id: testimonial
        type: text
        prompt: Write a testimonial for the Omarchy site (optional)
        maxLength: 280
        placeholder: One or two sentences

  - id: community
