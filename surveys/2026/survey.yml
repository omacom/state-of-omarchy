          - id: trimmed
            label: Removed some
          - id: nuke
            label: Removed the preinstalls in bulk
          - id: added
            label: Kept them and added more

      - id: browser
        type: single
        prompt: What's your default browser?
        options:
          - id: chromium
            label: Chromium
          - id: firefox
            label: Firefox
          - id: zen
            label: Zen
          - id: brave
            label: Brave
          - id: other
            label: Other
        allowOther: true

      - id: shell_utilities
        type: multiple
        prompt: Which of these built-in tools do you actually use?
        options:
          - id: clipboard_history
            label: Clipboard history
          - id: screenshots_recording
            label: Screenshots & recording
          - id: dictation
            label: Text extraction & dictation
          - id: web_apps
            label: Web apps (installed as native-feeling apps)
          - id: omarchy_cli
            label: Omarchy CLI (omarchy-* commands)
          - id: none
            label: None of these
        exclusiveOptions: [none]

  - id: plugins
    title: Plugins
    description: The plugin system.
    questions:
      - id: plugin_count
        type: single
        prompt: How many third-party plugins are enabled?
        options:
          - id: zero
            label: 0 — stock only
          - id: few
            label: 1–3
          - id: some
            label: 4–10
          - id: many
            label: 11+

      - id: plugin_source
        type: multiple
        prompt: Where do your plugins come from?
        options:
          - id: official
            label: Official / bundled
          - id: marketplace
            label: Plugin marketplace
          - id: git
            label: Random git URL
          - id: cloned
            label: Cloned a built-in and edited it
          - id: none
            label: I don't use extra plugins
        exclusiveOptions: [none]

      - id: plugin_trust
        type: single
        prompt: How do you treat third-party plugins?
        options:
          - id: avoid
            label: I avoid them
          - id: inspect
            label: I review the repo first
          - id: known
            label: Only from people I recognize
          - id: yeet
            label: Install and try

      - id: plugin_happiness
        type: scale
        prompt: Happiness with the plugin system?
        min: 1
        max: 5
        labels:
          1: Broken / unsafe
          5: This is the point of Quattro

      - id: plugin_writeins
        type: text_list
        prompt: Plugins you would tell a friend to install
        limit: 5
        placeholder: Plugin name or git URL

  - id: ai
    title: AI
    description: The default coding agent and local models.
    questions:
      - id: default_agent
        type: single
        prompt: Default coding agent?
        options:
