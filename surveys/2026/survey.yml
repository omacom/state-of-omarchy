# State of Omarchy 2026 — survey definition
# Source of truth for the form UI and the responses schema.
#
# Types:
#   single      one option id
#   multiple    array of option ids
#   scale       integer min..max
#   nps         integer 0..10
#   text        string
#   text_list   array of strings
#   country     ISO 3166-1 alpha-2 (renderer supplies the country list)
#
# Storage (suggested):
#   responses
#     id            uuid pk
#     edition_id    text        # omarchy2026
#     source        text null   # ?src= query, e.g. discord | x | github
#     started_at    timestamptz
#     submitted_at  timestamptz
#     completion    int         # 0–100, share of answered questions
#     user_agent    text null
#     locale        text null
#   answers
#     id            uuid pk
#     response_id   uuid fk responses(id) on delete cascade
#     question_id   text        # questions[].id
#     option_id     text null   # for single / each selected multiple option
#     number_value  int null    # scale, nps
#     text_value    text null   # text, text_list item, or "other" write-in
#     position      int null    # text_list order
#   unique (response_id, question_id, option_id, position)
#
# Do not rename an id after the survey opens. Add a new option instead.

survey:
  id: state_of_omarchy
  editionId: omarchy2026
  year: 2026
  title: State of Omarchy
  hashtag: StateOfOmarchy
  estimatedMinutes: 8
  version: 3

sections:
  - id: setup
    title: Setup
    description: How you installed Omarchy and how you run it.
    questions:
      - id: first_linux
        type: single
        required: true
        prompt: Is Omarchy your first experience with a Linux distribution?
        options:
          - id: yes
            label: Yes
          - id: no
            label: No

      - id: daily_driver
        type: single
        required: true
        prompt: Is Omarchy your daily driver?
        options:
          - id: only
            label: Yes — it's my only daily machine
          - id: primary
            label: Yes — primary, but I keep another OS around
          - id: secondary
            label: No — I use it on a second machine
          - id: trying
            label: Just trying it / not settled
          - id: stopped
            label: I installed it and moved on

      - id: install_path
        type: single
        required: true
        prompt: How did you first install it?
        options:
          - id: bare_metal
            label: Bare metal
          - id: dual_boot
            label: Dual boot
          - id: vm
            label: Virtual machine
          - id: try_omarchy_macos
            label: Try Omarchy app on macOS
          - id: try_omarchy_windows
            label: Try Omarchy app on Windows
          - id: apple_silicon
            label: Apple Silicon / Asahi-style install
          - id: other
            label: Other
        allowOther: true

      - id: machine_count
        type: single
        prompt: How many machines run Omarchy?
        options:
          - id: one
            label: '1'
          - id: two
            label: '2'
          - id: three_four
            label: 3–4
          - id: five_plus
            label: 5+

      - id: channel
        type: single
        prompt: Which update channel are you on?
        options:
          - id: stable
            label: Stable
          - id: rc
            label: RC
          - id: edge
            label: Edge
          - id: dev
            label: Dev
          - id: unsure
            label: Not sure

      - id: previous_os
        type: multiple
        prompt: What OS / distros were you primarily using before Omarchy?
        options:
          - id: macos
            label: macOS
          - id: windows
            label: Windows
          - id: ubuntu
            label: Ubuntu
          - id: omakub
            label: Omakub
          - id: fedora
            label: Fedora
          - id: debian
            label: Debian
          - id: vanilla_arch
            label: Vanilla Arch
          - id: cachyos
            label: CachyOS
          - id: endeavour
            label: EndeavourOS
          - id: nixos
            label: NixOS
          - id: popos
            label: Pop!_OS
          - id: other_linux
            label: Other Linux
          - id: none
            label: None — Omarchy is my first OS on this machine
        allowOther: true

  - id: hardware
    title: Hardware
    description: What you run it on.
    questions:
      - id: machine_types
        type: multiple
        required: true
        prompt: What hardware are you running Omarchy on?
        options:
          - id: framework
            label: Framework
          - id: lenovo
            label: Lenovo
          - id: dell
            label: Dell
          - id: intel_mac
            label: Intel Mac
          - id: apple_silicon
            label: Apple Silicon Mac
          - id: mini_pc
            label: Mini PC (Beelink, Minisforum, etc.)
          - id: desktop
            label: Custom desktop
          - id: other
            label: Other
        allowOther: true

      - id: apple_experience
        type: single
        prompt: If you use Apple hardware, how's the experience?
        showIf:
          questionId: machine_types
          op: includesAny
          values: [intel_mac, apple_silicon]
        options:
          - id: great
            label: Works great
          - id: usable
            label: Usable, with caveats
          - id: waiting_as
            label: Waiting on Apple Silicon to mature
          - id: gave_up
            label: Tried and gave up

      - id: gpu
        type: single
        prompt: Primary GPU?
        options:
          - id: intel
            label: Intel
          - id: amd
            label: AMD
          - id: nvidia
            label: NVIDIA
          - id: apple
            label: Apple Silicon
          - id: mixed
            label: Mixed / other

      - id: multi_monitor
        type: single
        prompt: How many monitors do you run?
        options:
          - id: one
            label: '1'
          - id: two
            label: '2'
          - id: three_plus
            label: '3+'

  - id: desktop
    title: Desktop Features
    description: Quattro, Quickshell, Hyprland.
    questions:
      - id: quattro_status
        type: single
        required: true
        prompt: Are you using Omarchy Quattro (v4.x)?
        options:
          - id: fresh
            label: Fresh v4.x install
          - id: upgraded
            label: Upgraded from v3.x
          - id: still_3
            label: Still on v3.x or older
          - id: rolled_back
            label: Upgraded, then rolled back
          - id: unsure
            label: Not sure

      - id: quattro_feel
        type: single
        prompt: Compared with the old Waybar / Walker / Mako stack, Quattro is…
        options:
          - id: better
            label: Clearly better
          - id: mixed
            label: Mixed
          - id: worse
            label: Worse
          - id: havent
            label: Haven't used both

      - id: bar_edge
        type: single
        prompt: Where does your bar live?
        options:
          - id: top
            label: Top
          - id: bottom
            label: Bottom
          - id: left
            label: Left
          - id: right
            label: Right

      - id: hyprland_comfort
        type: scale
        prompt: How comfortable are you with Hyprland tiling?
        min: 1
        max: 5
        labels:
          1: Still fighting it
          5: It's muscle memory

      - id: lua_config
        type: single
        prompt: Hyprland config in Lua — how is that going?
        options:
          - id: like
            label: I like it
          - id: fine
            label: Fine
          - id: miss_old
            label: I miss the old format
          - id: dont_touch
            label: I don't touch the config

  - id: themes
    title: Themes
    description: The theme system and switcher.
    questions:
      - id: default_themes
        type: multiple
        prompt: Which of the default themes do you use?
        limit: 3
        options:
          - id: tokyo_night
            label: Tokyo Night
          - id: catppuccin
            label: Catppuccin
          - id: catppuccin_latte
            label: Catppuccin Latte
          - id: everforest
            label: Everforest
          - id: gruvbox
            label: Gruvbox
          - id: nord
            label: Nord
          - id: rose_pine
            label: Rosé Pine
          - id: kanagawa
            label: Kanagawa
          - id: osaka_jade
            label: Osaka Jade
          - id: matte_black
            label: Matte Black
          - id: vantablack
            label: Vantablack
          - id: ristretto
            label: Ristretto
          - id: hackerman
            label: Hackerman
          - id: lumon
            label: Lumon
          - id: ethereal
            label: Ethereal
          - id: miasma
            label: Miasma
          - id: retro_82
            label: Retro 82
          - id: flexoki_light
            label: Flexoki Light
          - id: white
            label: White
          - id: solitude
            label: Solitude
          - id: last_horizon
            label: Last Horizon
          - id: lupine
            label: Lupine
          - id: none
            label: I don't use any of the default themes
        exclusiveOptions: [none]

      - id: favorite_themes
        type: text_list
        prompt: Name 3 of your favorite themes
        limit: 3
        placeholder: Theme name

      - id: theme_switch
        type: single
        prompt: How often do you switch themes?
        options:
          - id: once
            label: Set it once
          - id: daily
            label: Daily / by mood
          - id: weekly
            label: Weekly
          - id: monthly
            label: Monthly or less

      - id: theme_sync
        type: scale
        prompt: How well do themes stay in sync across shell, terminal, Neovim, VS Code, btop?
        min: 1
        max: 5
        labels:
          1: Always fighting drift
          5: One switch, everything matches

      - id: made_theme
        type: single
        prompt: Have you made your own theme?
        options:
          - id: published
            label: Yes, and I published it
          - id: private
            label: Yes, private only
          - id: want
            label: Not yet, I want to
          - id: no
            label: No

      - id: theme_tools
        type: single
        prompt: Which of these did you use to make your theme?
        showIf:
          questionId: made_theme
          op: includesAny
          values: [published, private]
        options:
          - id: aether
            label: Aether
          - id: omarchist
            label: Omarchist
          - id: manual
            label: Manually / cloning a theme and modifying it
          - id: other
            label: Other
        allowOther: true

  - id: apps
    title: Apps
    description: Defaults, editors, the Oma* tools.
    questions:
      - id: terminal
        type: single
        prompt: Which terminal do you use on Omarchy?
        options:
