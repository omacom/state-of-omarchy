name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:local.db"
      DATABASE_AUTH_TOKEN: ""
      ORIGIN: "http://localhost:5173"
      BETTER_AUTH_SECRET: "ci-only-secret-not-for-production"
      RESEND_API_KEY: "re_ci_dummy_key"
      RESEND_FROM: "State of Omarchy <survey@omarchy.org>"
      SURVEY_LAUNCHED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint survey.yml
        run: pnpm survey:lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
